---
components:
  schemas:
    SentinelReconfigurationStatusEvent:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/SM4sentinelReconfigurationStatusEvent/schema.json"

      description: >-
        Schema for Service Manager message SM4. This event publishes the updated
        Sentinel reconfiguration status after the Service Manager updates its
        registry based on a received Sentinel reconfiguration status message.
      type: object

      required:
        - id
        - type
        - timestamp

      properties:
        id:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
          format: uri
          type: string
          description: Unique identifier of this Sentinel reconfiguration status event.
          x-ngsi:
            type: Property


        type:
          type: string
          enum:
            - sentinelReconfigurationStatusEvent
          description: >-
            NGSI-LD entity type. It has to be
            sentinelReconfigurationStatusEvent.
          x-ngsi:
            type: Property

        originator:
          type: string
          enum:
            - SERVICE_MANAGER
          description: Component that generated the event.
          x-ngsi:
            type: Property

        messageId:
          type: string
          description: Unique identifier of this published message.
          x-ngsi:
            type: Property

        timestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the Sentinel reconfiguration status event was
            generated.
          x-ngsi:
            type: Property

        relatedSentinel:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
          format: uri
          type: string
          description: >-
            Sentinel entity whose reconfiguration status has been updated.
          x-ngsi:
            type: Relationship

        relatedOverwatch:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
          format: uri
          type: string
          description: Overwatch entity associated with the Sentinel.
          x-ngsi:
            type: Relationship

        reconfigurationStatus:
          type: string
          description: >-
            Current reconfiguration execution status of the Sentinel. Example:
            SUCCESS.
          x-ngsi:
            type: Property

        configurationVersion:
          type: string
          description: >-
            Configuration name or version currently associated with the Sentinel
            after reconfiguration.
          x-ngsi:
            type: Property

info:
  title: MEDIATE SM4 Sentinel Reconfiguration Status Event
  version: "0.1.0"
  description: >-
    Data model for Service Manager message SM4, used to publish updated Sentinel
    reconfiguration information to the Orchestrator and Dashboard.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object
