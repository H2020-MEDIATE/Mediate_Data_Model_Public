components:
  schemas:
    OverwatchSecurityStatusUpdatedEvent:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/SM2overwatchSecurityStatusUpdatedEvent/schema.json"

      description: >-
        Schema for Service Manager message SM2. This event publishes an
        aggregate security status summary for an Overwatch after the Service
        Manager updates the fleet security posture based on consumed anomaly
        detection information.
      type: object

      required:
      - id
      - type
      - timestamp

      properties:
        id:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
          format: uri
          type: string
          description: Unique identifier of this Overwatch security status update event.
          x-ngsi:
            type: Property


        type:
          type: string
          enum:
          - overwatchSecurityStatusUpdatedEvent
          description: >-
            NGSI-LD entity type. It has to be
            overwatchSecurityStatusUpdatedEvent.
          x-ngsi:
            type: Property

        originator:
          type: string
          enum:
          - SERVICE_MANAGER
          description: Component that generated the event.
          x-ngsi:
            type: Property

        relatedDetectedEventMessage:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
            type: string
          format: uri
          type: string
          description: Reference to the triggering M1 Detected Event Message entity id.
          x-ngsi:
            type: Relationship
        timestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the security status update event was
            generated.
          x-ngsi:
            type: Property

        relatedOverwatch:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
          format: uri
          type: string
          description: >-
            Overwatch entity whose security status is summarized by this event.
          x-ngsi:
            type: Relationship

        sentinelsUnderThreat:
          type: integer
          minimum: 0
          description: Number of Sentinels currently under threat.
          x-ngsi:
            type: Property

        totalActiveAlerts:
          type: integer
          minimum: 0
          description: >-
            Total number of active alerts known by the Service Manager for the
            related Overwatch.
          x-ngsi:
            type: Property

        registeredSentinels:
          type: integer
          minimum: 0
          description: >-
            Total number of Sentinels registered under the related Overwatch.
          x-ngsi:
            type: Property

        overallSecurityLevel:
          type: string
          description: >-
            Aggregate security level computed by the Service Manager for the
            related Overwatch. Example: AMBER.
          x-ngsi:
            type: Property

info:
  title: MEDIATE SM2 Overwatch Security Status Updated Event
  version: "0.1.0"
  description: >-
    Data model for Service Manager message SM2, used to publish an aggregate
    Overwatch security status summary to the Orchestrator and Dashboard.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object