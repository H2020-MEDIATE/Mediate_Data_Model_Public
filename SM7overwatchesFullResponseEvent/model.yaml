---
components:
  schemas:
    OverwatchesFullResponseEvent:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/SM7overwatchesFullResponseEvent/schema.json"

      description: >-
        Schema for Service Manager message SM7. This event is published by the
        Service Manager in response to GetOverwatchesFullCommand and returns the
        list of registered Overwatch entity references.
      type: object

      id:
        anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
        format: uri
        type: string
        description: Unique identifier of this Overwatches Full response event.
        x-ngsi:
          type: Property

      required:
        - id
        - type
        - timestamp

      properties:
        type:
          type: string
          enum:
            - overwatchesFullResponseEvent
          description: >-
            NGSI-LD entity type. It has to be
            overwatchesFullResponseEvent.
          x-ngsi:
            type: Property

        originator:
          type: string
          enum:
            - SERVICE_MANAGER
          description: Component that generated the response event.
          x-ngsi:
            type: Property

        messageId:
          type: string
          description: Unique identifier of this response message.
          x-ngsi:
            type: Property

        correlationId:
          type: string
          description: >-
            Identifier used to correlate this response event with the
            corresponding GetOverwatchesFullCommand.
          x-ngsi:
            type: Property

        timestamp:
          type: string
          format: date-time
          description: Date and time at which the response event was generated.
          x-ngsi:
            type: Property

        overwatches:
          type: array
          description: >-
            List of registered Overwatch entities returned by the Service
            Manager.
          items:
            anyOf:
              - description: Property. Identifier format of any NGSI entity.
                maxLength: 256
                minLength: 1
                pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
                type: string
            format: uri
            type: string
          x-ngsi:
            type: Relationship

info:
  title: MEDIATE SM7 Overwatches Full Response Event
  version: "0.1.0"
  description: >-
    Data model for Service Manager message SM7, used to return the list of
    registered Overwatch entity references to the Orchestrator.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object
