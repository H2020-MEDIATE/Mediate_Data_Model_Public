---
components:
  schemas:
    PolicyCountermeasureDecision:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/M7policyCountermeasureDecision/schema.json"

      description: >-
        Schema for MEDIATE Message M7. This message publishes the final Policy
        Manager countermeasure decision back to the DSS. It references the
        related M5 policy evaluation message and indicates the automatic
        selection, user selection, and final selected countermeasure to be
        enforced.
      type: object

      id:
        anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
        format: uri
        type: string
        description: Unique identifier of this policy countermeasure decision entity.
        x-ngsi:
          type: Property

      required:
        - id
        - type
        - timestamp

      properties:
        type:
          type: string
          enum:
            - policyCountermeasureDecision
          description: >-
            NGSI-LD entity type. It has to be
            policyCountermeasureDecision.
          x-ngsi:
            type: Property

        timestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the policy countermeasure decision was
            generated.
          x-ngsi:
            type: Property

        relatedPolicyEvaluation:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
          format: uri
          type: string
          description: >-
            Reference to the related M5 PolicyEvaluatedCountermeasures message
            containing the full Policy Manager evaluation details.
          x-ngsi:
            type: Relationship

        automaticSelection:
          type: array
          description: >-
            Countermeasures selected as candidates for enforcement by the Policy
            Manager.
          items:
            anyOf:
              - description: Property. Identifier format of any NGSI entity.
                maxLength: 256
                minLength: 1
                pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
                type: string
            format: uri
            type: string
          x-ngsi:
            type: Relationship

        userSelection:
          type: array
          description: >-
            Countermeasures selected as candidates for enforcement by the user.
          items:
            anyOf:
              - description: Property. Identifier format of any NGSI entity.
                maxLength: 256
                minLength: 1
                pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
                type: string
            format: uri
            type: string
          x-ngsi:
            type: Relationship

        selectedCountermeasure:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
          format: uri
          type: string
          description: >-
            Final countermeasure selected for enforcement and sent to the DSS.
          x-ngsi:
            type: Relationship

info:
  title: MEDIATE M7 Policy Countermeasure Decision
  version: "0.1.0"
  description: >-
    Data model for MEDIATE Message M7, used by the Policy Manager to publish
    the final countermeasure decision back to the DSS while referencing the
    related M5 policy evaluation message.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object
