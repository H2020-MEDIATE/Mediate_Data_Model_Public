---
components:
  schemas:
    ReconfigurationExecutionPlan:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/M8reconfigurationExecutionPlan/schema.json"

      description: >-
        Schema for MEDIATE Message M8. This message initiates a reconfiguration
        or deployment plan from the DSS to the Overwatch Broker and then to the
        Sentinel Reconfiguration Deployment Unit. It contains an ordered list of
        execution steps, where each step associates an asset with a
        countermeasure.
      type: object

      required:
        - id
        - type
        - timestamp

      properties:
        id:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
          format: uri
          type: string
          description: Unique identifier of this reconfiguration execution plan.
          x-ngsi:
            type: Property


        type:
          type: string
          enum:
            - reconfigurationExecutionPlan
          description: >-
            NGSI-LD entity type. It has to be reconfigurationExecutionPlan.
          x-ngsi:
            type: Property

        timestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the reconfiguration execution plan was
            generated.
          x-ngsi:
            type: Property

        orderedItems:
          type: array
          description: >-
            Ordered list of reconfiguration or deployment steps to be executed
            by the Sentinel Reconfiguration Deployment Unit.
          items:
            type: object
            properties:
              stepId:
                type: string
                description: >-
                  Property. Local identifier of the countermeasure execution
                  step within the execution plan.
                x-ngsi:
                  type: Property

              order:
                type: integer
                minimum: 1
                description: >-
                  Property. Execution order of the step within the plan.
                x-ngsi:
                  type: Property

              asset:
                anyOf:
                  - description: Property. Identifier format of any NGSI entity.
                    maxLength: 256
                    minLength: 1
                    pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
                    type: string
                format: uri
                type: string
                description: Asset entity targeted by this execution step.
                x-ngsi:
                  type: Relationship

              countermeasure:
                anyOf:
                  - description: Property. Identifier format of any NGSI entity.
                    maxLength: 256
                    minLength: 1
                    pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
                    type: string
                format: uri
                type: string
                description: >-
                  Countermeasure entity to be applied to the target asset.
                x-ngsi:
                  type: Relationship

          x-ngsi:
            type: Property

info:
  title: MEDIATE M8 Reconfiguration Execution Plan
  version: "0.1.0"
  description: >-
    Data model for MEDIATE Message M8, used by the DSS to initiate a
    reconfiguration or deployment plan through the Overwatch Broker toward the
    Sentinel Reconfiguration Deployment Unit.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object
