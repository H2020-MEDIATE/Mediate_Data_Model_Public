---
components:
  schemas:
    M1DetectedEventMessage:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/M1DetectedEventMessage/schema.json"

      description: >-
        Schema for MEDIATE Message M1 emitted by a Sentinel when an anomaly,
        attack, or abnormal event is detected. The NGSI-LD entity type is used
        by ComDeX for type-based subscription. Multi-typing is supported per
        ETSI GS CIM 009 v1.5.1 and later: an entity may carry one type (string)
        or several types (array).
      type: object

      required:
        - id
        - type
        - timestamp

      properties:
        id:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
              type: string
          format: uri
          type: string
          description: Unique identifier of this M1 detected-event message.
          x-ngsi:
            type: Property


        type:
          description: >-
            NGSI-LD entity type(s) used as the detected anomaly or attack
            category for ComDeX subscription. Either a single type (string) or
            multiple types (array of strings) per NGSI-LD multi-typing
            (ETSI GS CIM 009 >= v1.5.1).
          oneOf:
            - type: string
              enum:
                - geolocation-error
                - ids-detection-error
                - firmware-update-error
            - type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum:
                  - geolocation-error
                  - ids-detection-error
                  - firmware-update-error
          x-ngsi:
            type: Property

        timestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the anomaly, attack, or abnormal event was
            detected.
          x-ngsi:
            type: Property

        eventId:
          type: string
          description: >-
            Identifier of the detected event. It may be a UUID or another
            MEDIATE event identifier.
          x-ngsi:
            type: Property

        eventAssets:
          type: array
          description: >-
            List of asset entities associated with the detected event. A single event
            may involve one or more assets.
          items:
            anyOf:
              - description: Property. Identifier format of any NGSI entity.
                maxLength: 256
                minLength: 1
                pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
                type: string
            format: uri
            type: string
          x-ngsi:
            type: Relationship

        sentinelId:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
              type: string
          format: uri
          type: string
          description: >-
            Sentinel entity that detected the anomaly, attack, or abnormal
            event.
          x-ngsi:
            type: Relationship

        sentinelType:
          type: string
          description: >-
            Type/category of the Sentinel, for example hardware, software, edge,
            or cloud.
          x-ngsi:
            type: Property

        eventData:
          description: Raw or structured data describing the detected event.
          oneOf:
            - type: string
            - type: object
            - type: array
          x-ngsi:
            type: Property

        eventToolType:
          type: array
          description: >-
            List of tools, sensors, or sources involved in the detection.
            Examples: LIDAR, Camera, GNSS, Satellite.
          items:
            type: string
          x-ngsi:
            type: Property

        severityVector:
          type: array
          description: >-
            Numeric severity vector provided by the Sentinel. The meaning of
            each position must be confirmed by the responsible partners.
          items:
            type: number
          x-ngsi:
            type: Property

        mitigationAction:
          type: string
          description: >-
            Suggested mitigation action associated with the detected anomaly, attack, or
            abnormal event.
          x-ngsi:
            type: Property

        commentDetails:
          type: string
          description: >-
            Additional textual details about the detected anomaly, attack, or
            abnormal event.
          x-ngsi:
            type: Property


info:
  title: MEDIATE M1 Detected Event Message
  version: "0.2.0"
  description: >-
    Data model for MEDIATE Message M1. The NGSI-LD type is used by ComDeX
    subscriptions. Supports NGSI-LD multi-typing (type as string or array).

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object