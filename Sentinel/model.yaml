---
components:
  schemas:
    Sentinel:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/Sentinel/schema.json"

      description: >-
        Schema for the MEDIATE Sentinel entity. A Sentinel represents a monitored
        or managed component registered in the Service Manager registry. It includes
        its sentinel type, operational status, health status and security status,
        heartbeat information, active alerts count, its related Overwatch, managed
        Assets, last reconfiguration details, configuration version, and registration
        timestamp.
      type: object

      required:
        - id
        - type

      properties:
        id:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
              type: string
          format: uri
          type: string
          description: Unique identifier of the Sentinel entity.
          x-ngsi:
            type: Property

        type:
          type: string
          enum:
            - sentinel
          description: NGSI-LD entity type. It has to be sentinel.
          x-ngsi:
            type: Property

        sentinelType:
          type: string
          enum:
            - data-sentinel
            - software-sentinel
            - network-sentinel
          description: >-
            Category of the Sentinel. Standardized MVP enumeration shared with M1.
          x-ngsi:
            type: Property

        operationalStatus:
          type: string
          enum:
            - OPERATIONAL
            - RECONFIGURING
            - INITIALIZING
            - STOPPED
            - FAILED
          description: >-
            Current operational status of the Sentinel. Acquired from M12 heartbeat
            messages.
          x-ngsi:
            type: Property

        healthStatus:
          type: string
          enum:
            - HEALTHY
            - DEGRADED
            - OFFLINE
          description: >-
            Health status of the Sentinel, acquired from M12 heartbeat messages.
          x-ngsi:
            type: Property

        securityStatus:
          type: string
          description: >-
            Current security status of the Sentinel, derived by the Service Manager
            from the severityVector. Example: GREEN, AMBER, RED.
          x-ngsi:
            type: Property

        lastHeartbeat:
          type: string
          format: date-time
          description: Date and time of the latest heartbeat received from the Sentinel.
          x-ngsi:
            type: Property

        relatedOverwatch:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
              type: string
          format: uri
          type: string
          description: Reference to the Overwatch entity associated with the Sentinel.
          x-ngsi:
            type: Relationship

        managedAssets:
          type: array
          description: List of Asset entities managed or monitored by the Sentinel.
          items:
            anyOf:
              - description: Property. Identifier format of any NGSI entity.
                maxLength: 256
                minLength: 1
                pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
                type: string
            format: uri
            type: string
          x-ngsi:
            type: Relationship

        lastReconfiguration:
          type: object
          description: >-
            Structured summary of the last reconfiguration execution for this
            Sentinel, updated by the Service Manager upon receiving M11. Replaces
            the former lastReconfigurationStatus string attribute.
          properties:
            timestamp:
              type: string
              format: date-time
              description: Date and time at which the last reconfiguration was executed.
            state:
              type: string
              enum:
                - notInitiated
                - pending
                - inProgress
                - completed
                - failed
              description: Execution state of the last reconfiguration.
            result:
              type: string
              enum:
                - notInitiated
                - success
                - fail
              description: Result of the last reconfiguration execution.
            details:
              type: string
              description: Additional human-readable details about the last reconfiguration result.
          x-ngsi:
            type: Property

        configurationVersion:
          type: string
          description: Current configuration name or version associated with the Sentinel.
          x-ngsi:
            type: Property

        registrationTimestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the Sentinel was registered in the Service
            Manager registry.
          x-ngsi:
            type: Property

        activeAlertsCount:
          type: integer
          minimum: 0
          description: Number of currently active alerts associated with the Sentinel.
          x-ngsi:
            type: Property

info:
  title: MEDIATE Sentinel Entity
  version: "0.4.0"
  description: >-
    Data model for the MEDIATE Sentinel entity. Updated to replace
    lastReconfigurationStatus with the structured lastReconfiguration object
    (timestamp, state, result, details) to support Service Manager updates
    from M11 and Dashboard display.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object