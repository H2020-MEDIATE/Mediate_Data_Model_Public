components:
  schemas:
    Sentinel:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/Sentinel/schema.json"

      description: >-
        Schema for the MEDIATE Sentinel entity. A Sentinel represents a monitored
        or managed component registered in the Service Manager registry. It
        includes operational status, threat status, heartbeat information, its
        related Overwatch, managed Assets, reconfiguration status, configuration
        version, and registration timestamp.
      type: object

      required:
      - id
      - type

      properties:
        id:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
          format: uri
          type: string
          description: Unique identifier of this Sentinel entity.
          x-ngsi:
            type: Property


        type:
          type: string
          enum:
          - sentinel
          description: NGSI-LD entity type. It has to be sentinel.
          x-ngsi:
            type: Property

        sentinelType:
          type: string
          enum:
          - data-sentinel
          - software-sentinel
          - network-sentinel
          description: Category of the Sentinel. Standardized MVP enumeration shared with M1.
          x-ngsi:
            type: Property
        operationalStatus:
          type: string
          enum:
          - OPERATIONAL
          - RECONFIGURING
          - INITIALIZING
          - STOPPED
          - FAILED
          description: Current operational status of the Sentinel.
          x-ngsi:
            type: Property

        healthStatus:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - OFFLINE
          description: Health status of the Sentinel, acquired from M12 heartbeat messages.
          x-ngsi:
            type: Property
        securityStatus:
          type: string
          description: 'Current security status of the Sentinel, derived by the Service Manager from the severityVector. Example: GREEN, AMBER, RED.'
          x-ngsi:
            type: Property
        activeAlertsCount:
          type: integer
          minimum: 0
          description: Number of currently active alerts associated with the Sentinel.
          x-ngsi:
            type: Property
        lastHeartbeat:
          type: string
          format: date-time
          description: >-
            Date and time of the latest heartbeat received from the Sentinel.
          x-ngsi:
            type: Property

        relatedOverwatch:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
          format: uri
          type: string
          description: Overwatch entity associated with the Sentinel.
          x-ngsi:
            type: Relationship

        managedAssets:
          type: array
          description: >-
            List of Asset entities managed or monitored by the Sentinel.
          items:
            anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
            format: uri
            type: string
          x-ngsi:
            type: Relationship

        lastReconfigurationStatus:
          type: string
          description: >-
            Last known reconfiguration execution status of the Sentinel.
            Example: SUCCESS.
          x-ngsi:
            type: Property

        configurationVersion:
          type: string
          description: >-
            Current configuration name or version associated with the Sentinel.
          x-ngsi:
            type: Property

        registrationTimestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the Sentinel was registered in the Service
            Manager registry.
          x-ngsi:
            type: Property

info:
  title: MEDIATE Sentinel
  version: "0.1.0"
  description: >-
    Data model for the MEDIATE Sentinel entity, used by the Service Manager
    registry to represent a Sentinel, its operational and threat status, its
    related Overwatch, and its managed Assets.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object