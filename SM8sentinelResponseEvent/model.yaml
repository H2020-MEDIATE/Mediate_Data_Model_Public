components:
  schemas:
    SentinelResponseEvent:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/SM8sentinelResponseEvent/schema.json"

      description: >-
        Schema for Service Manager message SM8. This event is published by the
        Service Manager in response to GetSentinelCommand and returns a reference
        to the requested Sentinel entity.
      type: object

      required:
      - id
      - type
      - timestamp

      properties:
        id:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
          format: uri
          type: string
          description: Unique identifier of this Sentinel response event.
          x-ngsi:
            type: Property


        type:
          type: string
          enum:
          - sentinelResponseEvent
          description: NGSI-LD entity type. It has to be sentinelResponseEvent.
          x-ngsi:
            type: Property

        originator:
          type: string
          enum:
          - SERVICE_MANAGER
          description: Component that generated the response event.
          x-ngsi:
            type: Property

        relatedGetSentinelCommand:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
            type: string
          format: uri
          type: string
          description: Reference to the triggering OM2 GetSentinelCommand entity id.
          x-ngsi:
            type: Relationship
        timestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the Sentinel response event was generated.
          x-ngsi:
            type: Property

        relatedSentinel:
          anyOf:
          - description: Property. Identifier format of any NGSI entity.
            maxLength: 256
            minLength: 1
            pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
            type: string
          format: uri
          type: string
          description: Sentinel entity returned by the Service Manager.
          x-ngsi:
            type: Relationship

info:
  title: MEDIATE SM8 Sentinel Response Event
  version: "0.1.0"
  description: >-
    Data model for Service Manager message SM8, used to return the requested
    Sentinel entity reference to the Orchestrator.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object