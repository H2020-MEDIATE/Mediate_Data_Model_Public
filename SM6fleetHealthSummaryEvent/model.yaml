---
components:
  schemas:
    FleetHealthSummaryEvent:
      x-ngsi:
        uri-prefix: "https://raw.githubusercontent.com/H2020-MEDIATE/Mediate_Data_Model_Public/main/SM6fleetHealthSummaryEvent/schema.json"

      description: >-
        Schema for Service Manager message SM6. This event publishes an
        aggregate fleet health summary after the Service Manager processes
        Sentinel heartbeat information and updates its registry.
      type: object

      required:
        - id
        - type
        - timestamp

      properties:
        id:
          anyOf:
            - description: Property. Identifier format of any NGSI entity.
              maxLength: 256
              minLength: 1
              pattern: '^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$'
              type: string
          format: uri
          type: string
          description: Unique identifier of this fleet health summary event.
          x-ngsi:
            type: Property


        type:
          type: string
          enum:
            - fleetHealthSummaryEvent
          description: >-
            NGSI-LD entity type. It has to be fleetHealthSummaryEvent.
          x-ngsi:
            type: Property

        originator:
          type: string
          enum:
            - SERVICE_MANAGER
          description: Component that generated the event.
          x-ngsi:
            type: Property

        messageId:
          type: string
          description: Unique identifier of this published message.
          x-ngsi:
            type: Property

        correlationId:
          type: string
          description: >-
            Identifier used to correlate this event with the continuous
            health-monitoring flow.
          x-ngsi:
            type: Property

        timestamp:
          type: string
          format: date-time
          description: >-
            Date and time at which the fleet health summary event was generated.
          x-ngsi:
            type: Property

        totalSentinels:
          type: integer
          minimum: 0
          description: Total number of Sentinels registered in the fleet.
          x-ngsi:
            type: Property

        healthySentinels:
          type: integer
          minimum: 0
          description: Number of Sentinels currently classified as healthy.
          x-ngsi:
            type: Property

        degradedSentinels:
          type: integer
          minimum: 0
          description: Number of Sentinels currently classified as degraded.
          x-ngsi:
            type: Property

        offlineSentinels:
          type: integer
          minimum: 0
          description: Number of Sentinels currently classified as offline.
          x-ngsi:
            type: Property

        lastUpdated:
          type: string
          format: date-time
          description: >-
            Date and time at which the fleet health summary was last updated in
            the Service Manager registry.
          x-ngsi:
            type: Property

info:
  title: MEDIATE SM6 Fleet Health Summary Event
  version: "0.1.0"
  description: >-
    Data model for Service Manager message SM6, used to publish an aggregate
    fleet health summary to the Orchestrator and Dashboard.

openapi: "3.0.3"

paths:
  /ngsi-ld/v1/entities:
    get:
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: object
